name: Tests

on:
  push:
    branches: [master, next]
  pull_request:
    branches: [master, next]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-test:
    name: Lint and unit tests (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.8'
            os: ubuntu-24.04
          - python-version: '3.9'
            os: ubuntu-24.04
          - python-version: '3.10'
            os: ubuntu-latest
          - python-version: '3.11'
            os: ubuntu-latest
          - python-version: '3.12'
            os: ubuntu-latest
          - python-version: '3.13'
            os: ubuntu-latest
          - python-version: '3.14'
            os: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Lint
      run: make lint

    - name: Unit tests
      run: make test
